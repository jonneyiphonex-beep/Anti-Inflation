services:
  postgres:
    image: postgres:16-alpine
    container_name: anti_inflation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anti_inflation
      POSTGRES_USER: antiinflation
      POSTGRES_PASSWORD: antiinflation123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  postgres_data:
